[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dm8-verify"
version = "0.1.0"
description = "Streaming data baseline and consistency verification for DM8 research"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
dm8-verify = "dm8_verify.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
